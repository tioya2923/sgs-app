# Aplicação completa (frontend + API) com PostgreSQL, num só comando:
#   cp .env.docker.example .env   (e preencha os segredos)
#   docker compose up -d --build
# A aplicação fica em http://localhost:3300
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: sgs
    volumes:
      - sgs-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgs -d sgs"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sgs:${DB_PASSWORD}@db:5432/sgs
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      # Atrás de um proxy HTTPS (ex.: Caddy/nginx) ponha TRUST_PROXY=true
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Em http (teste local sem HTTPS) a imagem corre como produção e marca os cookies como "secure";
      # use um proxy HTTPS ou NODE_ENV=development só para experimentar localmente.
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3300:3300"

volumes:
  sgs-pgdata:
